<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DesignVault</title>
<style>
  :root {
    --bg: #08080a;
    --card: #121215;
    --card-hover: #17171b;
    --border: #232328;
    --text: #e8e8ea;
    --muted: #8a8a92;
    --accent: #7c5cff;
    --accent-2: #00e0c6;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(8, 8, 10, 0.85);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 20px 32px;
    display: flex;
    align-items: center;
    gap: 24px;
    flex-wrap: wrap;
  }

  header h1 {
    font-size: 20px;
    margin: 0;
    letter-spacing: -0.02em;
    white-space: nowrap;
  }

  header h1 span { color: var(--accent); }

  #search {
    flex: 1;
    min-width: 200px;
    max-width: 420px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 14px;
    color: var(--text);
    font-size: 14px;
  }

  #search:focus {
    outline: none;
    border-color: var(--accent);
  }

  #tagbar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    flex: 1;
  }

  .chip {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
    transition: border-color 0.15s, color 0.15s, background 0.15s;
  }

  .chip:hover { color: var(--text); border-color: #38383f; }

  .chip.active {
    color: #fff;
    border-color: var(--accent);
    background: rgba(124, 92, 255, 0.15);
  }

  main {
    padding: 24px 32px 60px;
  }

  #grid {
    columns: 320px;
    column-gap: 20px;
  }

  .card {
    break-inside: avoid;
    margin-bottom: 20px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
  }

  .card:hover {
    transform: translateY(-3px);
    border-color: #34343c;
    background: var(--card-hover);
  }

  .thumb {
    width: 100%;
    display: block;
    background: #000;
  }

  .thumb-placeholder {
    width: 100%;
    aspect-ratio: 4 / 3;
  }

  .card-body { padding: 14px 16px 16px; }

  .card-title {
    font-size: 14px;
    font-weight: 600;
    margin: 0 0 8px;
  }

  .card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .tag {
    font-size: 11px;
    color: var(--muted);
    background: #1c1c21;
    border-radius: 5px;
    padding: 3px 7px;
  }

  #empty {
    color: var(--muted);
    text-align: center;
    padding: 80px 20px;
    display: none;
  }

  dialog {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 0;
    width: min(720px, 92vw);
    max-height: 88vh;
    overflow-y: auto;
  }

  dialog::backdrop {
    background: rgba(0, 0, 0, 0.65);
    backdrop-filter: blur(3px);
  }

  #modal-media-wrap {
    width: 100%;
    background: #000;
    display: flex;
  }

  #modal-media-wrap img, #modal-media-wrap video {
    width: 100%;
    max-height: 60vh;
    object-fit: contain;
  }

  .modal-body { padding: 24px 28px 28px; }

  .modal-title {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  .modal-source {
    font-size: 13px;
    color: var(--accent-2);
    text-decoration: none;
    word-break: break-all;
  }

  .modal-source:hover { text-decoration: underline; }

  .section-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 20px 0 8px;
  }

  .swatches { display: flex; gap: 8px; }

  .swatch {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    border: 1px solid var(--border);
  }

  #modal-notes {
    font-size: 13px;
    color: var(--muted);
    margin: 0;
  }

  .prompt-box {
    position: relative;
    background: #0d0d10;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }

  .prompt-box pre {
    margin: 0;
    white-space: pre-wrap;
    word-break: break-word;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12.5px;
    line-height: 1.6;
    color: #d8d8de;
    max-height: 260px;
    overflow-y: auto;
  }

  #copy-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }

  #copy-btn:hover { background: #6d4dff; }

  #close-btn {
    position: absolute;
    top: 16px;
    right: 16px;
    background: rgba(0,0,0,0.4);
    color: #fff;
    border: none;
    border-radius: 8px;
    width: 32px;
    height: 32px;
    font-size: 16px;
    cursor: pointer;
    z-index: 2;
  }

  dialog { position: relative; }
</style>
</head>
<body>

<header>
  <h1>Design<span>Vault</span></h1>
  <input id="search" type="text" placeholder="Search titles or tags...">
  <div id="tagbar"></div>
</header>

<main>
  <div id="grid"></div>
  <div id="empty">No designs match.</div>
</main>

<dialog id="modal">
  <button id="close-btn" aria-label="Close">✕</button>
  <div id="modal-media-wrap"></div>
  <div class="modal-body">
    <h2 class="modal-title" id="modal-title"></h2>
    <a class="modal-source" id="modal-source" target="_blank" rel="noopener"></a>

    <div class="section-label">Tags</div>
    <div class="card-tags" id="modal-tags"></div>

    <div class="section-label">Palette</div>
    <div class="swatches" id="modal-swatches"></div>

    <div class="section-label">Notes</div>
    <p id="modal-notes"></p>

    <div class="section-label">Recreation prompt</div>
    <div class="prompt-box">
      <button id="copy-btn">Copy</button>
      <pre id="modal-prompt"></pre>
    </div>
  </div>
</dialog>

<script>
let designs = [];
let activeTag = null;

function placeholderStyle(colors) {
  const c = (colors && colors.length) ? colors : ["#1c1c21", "#2a2a31"];
  const stops = c.map((col, i) => `${col} ${Math.round(i / (c.length - 1 || 1) * 100)}%`).join(", ");
  return `background: linear-gradient(135deg, ${stops});`;
}

function renderTagbar() {
  const allTags = [...new Set(designs.flatMap(d => d.tags || []))].sort();
  const bar = document.getElementById("tagbar");
  bar.innerHTML = allTags.map(t =>
    `<button class="chip${t === activeTag ? " active" : ""}" data-tag="${t}">${t}</button>`
  ).join("");
  bar.querySelectorAll(".chip").forEach(chip => {
    chip.addEventListener("click", () => {
      activeTag = activeTag === chip.dataset.tag ? null : chip.dataset.tag;
      renderTagbar();
      renderGrid();
    });
  });
}

function renderGrid() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const filtered = designs.filter(d => {
    const matchesQuery = !q || d.title.toLowerCase().includes(q) ||
      (d.tags || []).some(t => t.toLowerCase().includes(q));
    const matchesTag = !activeTag || (d.tags || []).includes(activeTag);
    return matchesQuery && matchesTag;
  });

  const grid = document.getElementById("grid");
  document.getElementById("empty").style.display = filtered.length ? "none" : "block";

  grid.innerHTML = filtered.map((d, i) => {
    const idx = designs.indexOf(d);
    let media;
    if (d.media && d.media_type === "video") {
      media = `<video class="thumb" src="/static/${d.media}" muted loop playsinline preload="metadata"></video>`;
    } else if (d.media) {
      media = `<img class="thumb" src="/static/${d.media}" loading="lazy" alt="${d.title}">`;
    } else {
      media = `<div class="thumb thumb-placeholder" style="${placeholderStyle(d.colors)}"></div>`;
    }
    const tags = (d.tags || []).map(t => `<span class="tag">${t}</span>`).join("");
    return `<div class="card" data-idx="${idx}">${media}<div class="card-body"><p class="card-title">${d.title}</p><div class="card-tags">${tags}</div></div></div>`;
  }).join("");

  grid.querySelectorAll(".card").forEach(card => {
    const video = card.querySelector("video");
    if (video) {
      card.addEventListener("mouseenter", () => video.play());
      card.addEventListener("mouseleave", () => { video.pause(); video.currentTime = 0; });
    }
    card.addEventListener("click", () => openModal(designs[Number(card.dataset.idx)]));
  });
}

function openModal(d) {
  const wrap = document.getElementById("modal-media-wrap");
  if (d.media && d.media_type === "video") {
    wrap.innerHTML = `<video src="/static/${d.media}" controls autoplay loop></video>`;
  } else if (d.media) {
    wrap.innerHTML = `<img src="/static/${d.media}" alt="${d.title}">`;
  } else {
    wrap.innerHTML = `<div class="thumb-placeholder" style="width:100%;${placeholderStyle(d.colors)}"></div>`;
  }

  document.getElementById("modal-title").textContent = d.title;
  const src = document.getElementById("modal-source");
  if (d.source_url) {
    src.textContent = d.source_url;
    src.href = d.source_url;
    src.style.display = "inline";
  } else {
    src.style.display = "none";
  }

  document.getElementById("modal-tags").innerHTML =
    (d.tags || []).map(t => `<span class="tag">${t}</span>`).join("");

  document.getElementById("modal-swatches").innerHTML =
    (d.colors || []).map(c => `<div class="swatch" style="background:${c}" title="${c}"></div>`).join("");

  document.getElementById("modal-notes").textContent = d.notes || "";
  document.getElementById("modal-prompt").textContent = d.recreation_prompt || "";

  document.getElementById("modal").showModal();
}

document.getElementById("close-btn").addEventListener("click", () => {
  document.getElementById("modal").close();
});

document.getElementById("modal").addEventListener("click", (e) => {
  if (e.target.id === "modal") document.getElementById("modal").close();
});

document.getElementById("modal").addEventListener("close", () => {
  const v = document.querySelector("#modal-media-wrap video");
  if (v) v.pause();
});

document.getElementById("copy-btn").addEventListener("click", async () => {
  const btn = document.getElementById("copy-btn");
  await navigator.clipboard.writeText(document.getElementById("modal-prompt").textContent);
  btn.textContent = "Copied ✓";
  setTimeout(() => { btn.textContent = "Copy"; }, 1500);
});

document.getElementById("search").addEventListener("input", renderGrid);

fetch("/designs.json")
  .then(r => r.json())
  .then(data => {
    designs = data;
    renderTagbar();
    renderGrid();
  });
</script>
</body>
</html>
